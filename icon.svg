<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="leatherGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#2a221d"/>
      <stop offset="65%" stop-color="#14100d"/>
      <stop offset="100%" stop-color="#090706"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e2af"/>
      <stop offset="50%" stop-color="#b89352"/>
      <stop offset="100%" stop-color="#6e5222"/>
    </linearGradient>
  </defs>
  <!-- 黒革の表紙ベース -->
  <rect x="52" y="24" width="408" height="464" rx="20" fill="url(#leatherGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- 背表紙の溝 -->
  <line x1="96" y1="28" x2="96" y2="484" stroke="#070504" stroke-width="8"/>
  <line x1="100" y1="28" x2="100" y2="484" stroke="#b89352" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- 内枠 -->
  <rect x="128" y="64" width="296" height="384" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.7"/>
  <!-- 中央の幾何学メダリオン（文字なし） -->
  <circle cx="276" cy="256" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.75"/>
  <polygon points="276,174 296,236 358,256 296,276 276,338 256,276 194,256 256,236" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.65"/>
  <circle cx="276" cy="256" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.8"/>
</svg>
